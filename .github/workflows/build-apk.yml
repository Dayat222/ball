name: Build Android Release APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Restore signing keystore & secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD" \
            > keystore.properties

      - name: Build Release APK (R8 minified)
        run: gradle assembleRelease --stacktrace

      - name: Stage release asset
        run: cp app/build/outputs/apk/release/app-release.apk app-latest.apk

      - name: Pin SHA-256 into version manifest
        run: |
          APK_SHA=$(sha256sum app-latest.apk | awk '{print $1}')
          jq --arg sha "$APK_SHA" '.sha256 = $sha' version.json > version.json.tmp
          mv version.json.tmp version.json

      - name: Commit pinned manifest back to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add version.json
          if git diff --cached --quiet; then
            echo "No manifest change; skipping commit."
          else
            git commit -m "chore: pin release SHA-256 [skip ci]"
            git push
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Toolkit-Release-APK
          path: app-latest.apk
          if-no-files-found: error

      - name: Remove stale release assets
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | while read -r name; do
            if [ "$name" != "version.json" ] && [ "$name" != "app-latest.apk" ]; then
              gh release delete-asset latest "$name" --repo "$GITHUB_REPOSITORY" --yes || true
            fi
          done

      - name: Publish Latest GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Toolkit - Latest Release"
          body: "Automated release build with In-App Updater support."
          files: |
            app-latest.apk
            version.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
